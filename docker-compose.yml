# ── scrape-flow · docker-compose ─────────────────────────────────────
# Development stack: API server + Redis (optional job queue).
# Run: docker compose up --build
# ─────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  api:
    build: .
    container_name: scrape-flow-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data:/app/data  # persist scrape results locally

  redis:
    image: redis:7-alpine
    container_name: scrape-flow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
